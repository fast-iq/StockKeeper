openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Inventory management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: categories
    description: Category tree operations
  - name: items
    description: Inventory item operations
  - name: dashboard
    description: Dashboard & analytics
  - name: shopping-list
    description: Shopping list operations
paths:
  /price-settings:
    get:
      operationId: getPriceSettings
      tags: [items]
      responses:
        "200":
          description: Price display preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceSettings" }
    patch:
      operationId: updatePriceSettings
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceSettings" }
      responses:
        "200":
          description: Saved preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceSettings" }
  /shops:
    get:
      operationId: listShops
      tags: [items]
      responses:
        "200":
          description: Account shops
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Shop" }
    post:
      operationId: createShop
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopInput" }
      responses:
        "201":
          description: Created or reused shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }
  /items/{id}/prices:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: listItemPrices
      tags: [items]
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemPrice" }
    post:
      operationId: createItemPrice
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemPriceInput" }
      responses:
        "201":
          description: Price created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPrice" }
  /items/{id}/prices/{priceId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: priceId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: updateItemPrice
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemPriceInput" }
      responses:
        "200":
          description: Price updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPrice" }
    delete:
      operationId: deleteItemPrice
      tags: [items]
      responses:
        "204": { description: Price deleted }
  /data/export:
    get:
      operationId: exportData
      tags: [items]
      summary: Download the current user's inventory or full account data
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [json, xlsx]
      responses:
        "200":
          description: Downloadable file; JSON excludes credentials and sessions
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Not authenticated
  /data/preview:
    post:
      operationId: previewDataImport
      tags: [items]
      summary: Validate a file without writing any data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferFileInput"
      responses:
        "200":
          description: Validated content and warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferPreview"
        "400":
          description: Invalid or unsupported file
        "401":
          description: Not authenticated
  /data/import:
    post:
      operationId: importData
      tags: [items]
      summary: Atomically append validated data, optionally skipping matching records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferImportInput"
      responses:
        "200":
          description: Import counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferImportResult"
        "400":
          description: Invalid data
        "401":
          description: Not authenticated
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/google:
    post:
      operationId: googleLogin
      tags: [auth]
      summary: Login with Google
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginBody"
      responses:
        "200":
          description: Google login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid request or Google authentication is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid Google credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordBody"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid current password or input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordBody"
      responses:
        "200":
          description: Reset email sent (or logged if SMTP not configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories as a tree
      responses:
        "200":
          description: Category tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryNode"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryBody"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get a category by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryBody"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /items:
    get:
      operationId: listItems
      tags: [items]
      summary: List items with optional filters
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: locationId
          in: query
          required: false
          schema:
            type: integer
        - name: includeSubcategories
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Items list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
    post:
      operationId: createItem
      tags: [items]
      summary: Create a new item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemBody"
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /items/{id}:
    get:
      operationId: getItem
      tags: [items]
      summary: Get an item by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateItem
      tags: [items]
      summary: Update an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemBody"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteItem
      tags: [items]
      summary: Delete an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent:
    get:
      operationId: getRecentItems
      tags: [dashboard]
      summary: Get recently added items
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Recent items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /dashboard/category-counts:
    get:
      operationId: getCategoryCounts
      tags: [dashboard]
      summary: Get item counts per top-level category
      responses:
        "200":
          description: Category counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryCount"

  /shopping-list:
    get:
      operationId: listShoppingList
      tags: [shopping-list]
      summary: Get shopping list
      responses:
        "200":
          description: Shopping list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShoppingListItem"
    post:
      operationId: addToShoppingList
      tags: [shopping-list]
      summary: Add item to shopping list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToShoppingListBody"
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shopping-list/checked:
    delete:
      operationId: clearCheckedShoppingList
      tags: [shopping-list]
      summary: Clear all checked items
      responses:
        "204":
          description: Cleared

  /shopping-list/{id}:
    patch:
      operationId: updateShoppingListItem
      tags: [shopping-list]
      summary: Update a shopping list item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShoppingListBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteShoppingListItem
      tags: [shopping-list]
      summary: Remove item from shopping list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ShopInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    Shop:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    ItemPriceInput:
      type: object
      required: [shopId, price, priceDate]
      properties:
        shopId: { type: integer, minimum: 1 }
        price: { type: number, minimum: 0, maximum: 999999999999.99 }
        priceDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    ItemPrice:
      allOf:
        - { $ref: "#/components/schemas/ItemPriceInput" }
        - type: object
          required: [id, itemId, shopName, createdAt]
          properties:
            id: { type: integer }
            itemId: { type: integer }
            shopName: { type: string }
            createdAt: { type: string, format: date-time }
    PriceSettings:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [lowest, latest] }
    TransferShop:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    TransferPrice:
      allOf:
        - { $ref: "#/components/schemas/ItemPriceInput" }
        - type: object
          required: [id, itemId]
          properties:
            id: { type: integer }
            itemId: { type: integer }
            createdAt: { type: string }
    TransferFileInput:
      type: object
      required: [fileName, content]
      properties:
        fileName:
          type: string
          maxLength: 255
        content:
          type: string
          description: Base64 encoded file, maximum 5 MiB decoded
          maxLength: 6990508
    TransferCounts:
      type: object
      required: [items, categories, locations, units, shoppingList]
      properties:
        shops: { type: integer }
        prices: { type: integer }
        items:
          type: integer
        categories:
          type: integer
        locations:
          type: integer
        units:
          type: integer
        shoppingList:
          type: integer
    TransferCategory:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        parentId:
          type: ["integer", "null"]
        description:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        createdAt:
          type: string
    TransferLocation:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        createdAt:
          type: string
    TransferUnit:
      type: object
      required: [id, name, symbol]
      properties:
        id:
          type: integer
        name:
          type: string
        symbol:
          type: string
    TransferItem:
      allOf:
        - $ref: "#/components/schemas/CreateItemBody"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
            createdAt:
              type: string
            updatedAt:
              type: string
    TransferShoppingEntry:
      type: object
      required: [id, name, quantity, checked]
      properties:
        id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        checked:
          type: boolean
        itemId:
          type: ["integer", "null"]
        unit:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        createdAt:
          type: string
    TransferBundle:
      type: object
      required:
        [format, version, categories, locations, units, items, shoppingList]
      properties:
        format:
          type: string
          enum: [stockkeeper]
        version:
          type: integer
          enum: [1, 2]
        exportedAt:
          type: string
        categories:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/TransferCategory"
        locations:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/TransferLocation"
        units:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/TransferUnit"
        items:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/TransferItem"
        shoppingList:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/TransferShoppingEntry"
        shops:
          type: array
          items: { $ref: "#/components/schemas/TransferShop" }
        prices:
          type: array
          items: { $ref: "#/components/schemas/TransferPrice" }
    TransferPreview:
      type: object
      required: [data, counts, warnings]
      properties:
        data:
          $ref: "#/components/schemas/TransferBundle"
        counts:
          $ref: "#/components/schemas/TransferCounts"
        warnings:
          type: array
          items:
            type: string
    TransferImportInput:
      type: object
      required: [data, mode]
      properties:
        data:
          $ref: "#/components/schemas/TransferBundle"
        mode:
          type: string
          enum: [skip, add]
    TransferImportResult:
      type: object
      required: [created, skipped]
      properties:
        created:
          $ref: "#/components/schemas/TransferCounts"
        skipped:
          type: integer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        language:
          type: string
          enum:
            - auto
            - ru
            - en
        isAdmin:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - email
        - name
        - language
        - isAdmin
        - createdAt

    RegisterBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
      required:
        - email
        - password
        - name

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    GoogleLoginBody:
      type: object
      properties:
        idToken:
          type: string
          minLength: 1
      required:
        - idToken

    ChangePasswordBody:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
      required:
        - currentPassword
        - newPassword

    AuthResponse:
