name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Review dependencies
    runs-on: ubuntu-latest
    # Dependency Review API требует GitHub Advanced Security для приватных
    # репозиториев — без лицензии job пропускается.
    if: github.repository_owner == 'fast-iq' && github.event.repository.private == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          base: main
