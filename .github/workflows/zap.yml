name: OWASP ZAP

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'fast-iq'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stockkeeper
          POSTGRES_PASSWORD: zap-ci-password
          POSTGRES_DB: stockkeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockkeeper"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PORT: "8080"
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgresql://stockkeeper:zap-ci-password@127.0.0.1:5432/stockkeeper
      SESSION_SECRET: zap-ci-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create database schema
        run: pnpm --filter @workspace/db run push

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Start API server
        run: |
          node --enable-source-maps artifacts/api-server/dist/index.mjs > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/healthz > /dev/null; then
              echo "Server is up (attempt ${i})"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/healthz

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8080/api"
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          artifact_name: zap-baseline

      - name: Show API server log
        if: always()
        run: cat server.log || true
