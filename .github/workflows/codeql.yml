name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "15 0 * * *"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    # CodeQL требует GitHub Advanced Security для приватных репозиториев —
    # без лицензии job пропускается (включится автоматически при публикации репо).
    if: github.repository_owner == 'fast-iq' && github.event.repository.private == false
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
