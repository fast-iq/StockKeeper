name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.command }})
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'fast-iq'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        command: ["lint", "typecheck", "format:check"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm ${{ matrix.command }}
        run: pnpm ${{ matrix.command }}

  test:
    name: Test
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'fast-iq'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  transfer-integration:
    name: Backup restore (PostgreSQL)
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'fast-iq'
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: transfer_test
          POSTGRES_PASSWORD: transfer-ci-only
          POSTGRES_DB: stockkeeper_transfer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transfer_test -d stockkeeper_transfer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TRANSFER_TEST_DATABASE_URL: postgresql://transfer_test:transfer-ci-only@127.0.0.1:5432/stockkeeper_transfer_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore backups through API against isolated test schema
        run: pnpm test:integration
      - name: Install browser for confirmation regression
        run: pnpm --filter @workspace/inventory-app exec playwright install --with-deps chromium
      - name: Confirm imports in browser against isolated test schema
        run: pnpm test:browser

  build:
    name: Build
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'fast-iq'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspaces
        run: pnpm run build

  security-audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'fast-iq'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high and above)
        run: pnpm audit --audit-level=high
